name: Documentation quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_docs.py'
      - 'scripts/check_editorial.py'
      - 'practice-labs/case-studies/**'
      - '.github/workflows/docs-quality.yml'
  push:
    branches: [master]
    paths:
      - '**/*.md'
      - 'scripts/check_docs.py'
      - 'practice-labs/case-studies/**'
      - '.github/workflows/docs-quality.yml'

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check added prose for editorial style
        run: python scripts/check_editorial.py --base HEAD^
      - name: Validate internal Markdown links
        run: python scripts/check_docs.py
      - name: Validate synthetic case study datasets
        run: python practice-labs/case-studies/validate_datasets.py
